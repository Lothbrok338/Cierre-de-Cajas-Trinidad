<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Cierre Diario de Caja{% endblock %} · UNIVALLE</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <a class="marca" href="/"><span class="marca-1">UNIVALLE</span><span class="marca-2">Cierre Diario de Caja</span></a>
    {% if user %}
    <nav class="nav">
      <a href="/">{{ 'Cierres' if user.rol != 'cajero' else 'Mis cierres' }}</a>
      {% if user.rol == 'cajero' %}<a href="/nuevo">Nuevo cierre</a>{% endif %}
    </nav>
    <form method="post" action="/logout" class="sesion">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <span class="quien">{{ user.nombre }} <small>({{ user.rol }})</small></span>
      <button class="btn btn-sec btn-sm" type="submit">Salir</button>
    </form>
    {% endif %}
  </div>
</header>
<main class="contenedor">
  {% if flash %}<div class="aviso aviso-{{ flash.tipo }}" role="status">{{ flash.msg }}</div>{% endif %}
  {% block contenido %}{% endblock %}
</main>
<script src="/static/app.js"></script>
</body>
</html>
