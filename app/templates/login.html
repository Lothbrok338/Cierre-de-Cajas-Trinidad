{% extends 'base.html' %}
{% block titulo %}Ingreso{% endblock %}
{% block contenido %}
<section class="tarjeta login">
  <img class="login-logo" src="/static/logo-univalle.png" alt="UNIVALLE — La respuesta científica al futuro" width="260" height="66">
  <h1>Ingreso al sistema</h1>
  {% if not configurado %}
    <div class="aviso aviso-error">Sistema no configurado. Avise al administrador.</div>
  {% else %}
    {% if error %}<div class="aviso aviso-error" role="alert">{{ error }}</div>{% endif %}
    <form method="post" action="/login" autocomplete="on">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="usuario">Usuario</label>
      <input id="usuario" name="usuario" type="text" required autofocus autocomplete="username">
      <label for="clave">Clave</label>
      <input id="clave" name="clave" type="password" required autocomplete="current-password">
      <button class="btn btn-prim btn-block" type="submit">Ingresar</button>
    </form>
  {% endif %}
</section>
{% endblock %}
